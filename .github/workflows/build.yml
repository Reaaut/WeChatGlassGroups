name: Build Tweak

# 在 macOS runner 上编译 Theos 插件。
# 你在 Windows 上写完代码 push 上来就行，不用本地装任何工具链。
#
# 产物：Actions 页面 → 这次 run → 底部 Artifacts → 下载 WeChatGlassGroups-deb
#
# ⚠️ 两个已经踩过的坑，改这个文件时别再犯：
#   1) 不要用 working-directory 指定工程目录！
#      GitHub 会把仓库内容放进 /Users/runner/work/<仓库名>/<仓库名>，
#      而本仓库内部还有一层同名文件夹 WeChatGlassGroups/，
#      再叠加 working-directory 就会变成 .../WeChatGlassGroups/WeChatGlassGroups/WeChatGlassGroups
#      → 目录不存在 → shell 启动失败 → 0 秒报错。
#      所以下面统一用 run 里的 cd 进工程目录。
#   2) 不要覆盖 env.PATH。macOS runner 自带的 PATH 已包含 /usr/bin（make 在这里）
#      和 Xcode toolchain；自己覆盖反而可能把 Theos 需要的路径弄丢。
#      诊断步骤统一用 || true 兜底，绝不会因为日志打不出来就挡住编译。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 也可以在网页上点按钮手动触发

jobs:
  build:
    # ⚠️ 必须是 macOS runner。Linux runner 编译 iOS Tweak 会缺私有框架 tbd，
    #    这条路坑很深，不要改成 ubuntu-latest。
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 Theos（内部会编译 Theos 自己的工具链，通常要 30~60 秒）
      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      # ---------------------------------------------------------------------
      # 诊断 + 配置：把 THEOS 和 PATH 写进 $GITHUB_ENV，供后续步骤使用。
      # theos-action 不保证会把 $THEOS 传给后面的步骤。
      # ---------------------------------------------------------------------
      - name: Locate Theos
        run: |
          echo "THEOS(env) = '${THEOS}'"
          for d in "$HOME/theos" "$GITHUB_WORKSPACE/theos" "/opt/theos" "/Users/runner/theos"; do
            if [ -d "$d/makefiles" ]; then echo "FOUND: $d"; else echo "not here: $d"; fi
          done

          if [ -z "$THEOS" ] || [ ! -d "$THEOS/makefiles" ]; then
            for d in "$HOME/theos" "$GITHUB_WORKSPACE/theos" "/opt/theos" "/Users/runner/theos"; do
              if [ -d "$d/makefiles" ]; then
                echo "THEOS=$d" >> "$GITHUB_ENV"
                echo "→ 选用 $d"
                break
              fi
            done
          else
            echo "THEOS=$THEOS" >> "$GITHUB_ENV"
            echo "→ 沿用环境里的 $THEOS"
          fi

      - name: Prepare SDK
        run: |
          echo "THEOS=$THEOS"
          ls -la "$THEOS/sdks" || true
          if [ -z "$(ls -A "$THEOS/sdks" 2>/dev/null)" ]; then
            echo "Theos 没有自带 SDK，从 Xcode 拷贝一份"
            SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
            echo "Xcode SDK: $SDK_PATH"
            mkdir -p "$THEOS/sdks"
            cp -R "$SDK_PATH" "$THEOS/sdks/iPhoneOS16.4.sdk"
          fi
          ls -la "$THEOS/sdks"

      # 纯诊断步骤：全部容错，绝不能因为它本身失败而挡住编译
      - name: Show toolchain
        run: |
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"
          echo "--- make ---"
          command -v make || echo "make NOT in PATH"
          { make --version 2>&1 | head -n1; } || echo "make --version 失败"
          echo "--- xcodebuild ---"
          xcodebuild -version 2>&1 || echo "xcodebuild 失败（不影响编译，Theos 用自带 toolchain）"
          echo "--- 仓库根目录 ---"
          ls -la
          echo "--- 工程目录 ---"
          ls -la WeChatGlassGroups
          echo "--- 架构 ---"
          uname -m

      - name: Build package
        run: |
          cd WeChatGlassGroups
          echo "=== 开始编译 ==="
          make clean 2>&1 || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1

      # 关键校验：确认 dylib 真的编成了 arm64e，且签名没丢。
      # 很多人卡在"装上了但插件不生效"，十次有九次是架构或签名不对。
      - name: Verify binary
        if: success()
        run: |
          set -e
          cd WeChatGlassGroups
          DYLIB="$(find .theos/obj -name 'WeChatGlassGroups.dylib' | head -n1)"
          echo "dylib: $DYLIB"
          file "$DYLIB"
          echo "--- 期望看到 arm64e ---"
          lipo -archs "$DYLIB" || true
          echo "--- 签名信息 ---"
          codesign -dvvv "$DYLIB" 2>&1 || true
          echo "--- 链接了哪些库 ---"
          otool -L "$DYLIB"
          echo "--- 检查是否误链 Swift 运行时（链了就会崩） ---"
          if otool -L "$DYLIB" | grep -q swift; then
            echo "⚠️ 警告：链接了 Swift 运行时"
          else
            echo "OK：没有链接 Swift 运行时"
          fi

      - name: Collect deb
        if: success()
        run: |
          mkdir -p out
          cp WeChatGlassGroups/packages/*.deb out/ 2>/dev/null || cp WeChatGlassGroups/*.deb out/
          ls -la out

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGlassGroups-deb
          path: out/*.deb
          if-no-files-found: error

      # 编译中间产物，出问题时用它排错
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: WeChatGlassGroups/.theos/
          if-no-files-found: ignore
