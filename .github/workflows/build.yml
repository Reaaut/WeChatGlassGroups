name: Build Tweak

# 在 macOS runner 上编译 Theos 插件。
# 产物：Actions 页面 → 这次 run → 底部 Artifacts → 下载 WeChatGlassGroups-deb
#
# ⚠️ 已踩过的坑，改这个文件时别再犯（每条都真实翻车过）：
#
#   1) 不要用 working-directory 指向工程目录。GitHub 把仓库放在
#      /Users/runner/work/<仓库名>/<仓库名>，仓库内又有一层 WeChatGlassGroups/，
#      叠加后会变成三层同名路径 → 目录不存在 → shell 启动失败。统一用 cd。
#
#   2) GitHub Actions 的 bash 默认带 -e，任何命令非零退出就整步失败。
#      所以"纯诊断步骤"很危险（一句 command -v 就能让整轮变红）。
#
#   3) 不要覆盖 env.PATH。
#
#   4) 不要改成 macos-13：那是 x86_64 runner，编不出 arm64e，装 iPhone 14 Pro 无效。
#
#   5) 失败信息要能被读到：用 ::error:: 写注解、用 tee 落盘日志。
#      否则只能看到 "exit code 1"，什么线索都没有（已经吃过这个亏）。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    # 允许把编译出来的 deb 提交回仓库（用户直接从网页下载）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 找到 Theos（runner 镜像通常自带），找不到就克隆一份
      - name: Find Theos
        run: |
          set +e
          FOUND=""
          if [ -n "$THEOS" ] && [ -f "$THEOS/makefiles/common.mk" ]; then FOUND="$THEOS"; fi
          for d in "$HOME/theos" "$GITHUB_WORKSPACE/theos" /opt/theos /Users/runner/theos; do
            if [ -z "$FOUND" ] && [ -f "$d/makefiles/common.mk" ]; then FOUND="$d"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "未找到 Theos，克隆一份"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos" || true
            FOUND="$HOME/theos"
          fi
          echo "THEOS=$FOUND" >> "$GITHUB_ENV"
          echo "使用 Theos: $FOUND"
          # sdks 是 submodule，里面才是 iPhoneOS SDK
          if [ -d "$FOUND/.git" ] && [ ! -d "$FOUND/sdks/iPhoneOS16.4.sdk" ]; then
            echo "同步 sdks submodule..."
            git -C "$FOUND" submodule update --init --recursive || true
          fi
          echo "--- sdks ---"
          ls -la "$FOUND/sdks" 2>/dev/null || echo "sdks 不存在"
          exit 0

      # 定位 make，并把结果写进 GITHUB_ENV / GITHUB_PATH
      - name: Locate make
        run: |
          set +e
          echo "当前 PATH=$PATH"
          MAKE_BIN="$(command -v make 2>/dev/null)"
          if [ -z "$MAKE_BIN" ] && [ -x /usr/bin/make ]; then MAKE_BIN=/usr/bin/make; fi
          if [ -z "$MAKE_BIN" ]; then
            for c in /Library/Developer/CommandLineTools/usr/bin/make \
                     /Applications/Xcode.app/Contents/Developer/usr/bin/make; do
              if [ -x "$c" ]; then MAKE_BIN="$c"; break; fi
            done
          fi
          if [ -n "$MAKE_BIN" ]; then
            echo "找到 make: $MAKE_BIN"
            echo "MAKE_BIN=$MAKE_BIN" >> "$GITHUB_ENV"
            dirname "$MAKE_BIN" >> "$GITHUB_PATH"
          else
            echo "⚠️ 找不到 make"
          fi
          exit 0

      # ---------------------------------------------------------------------
      # Theos 打包依赖：dpkg-deb（打 deb 包）+ ldid（给 dylib 签名）。
      # macOS runner 默认都没有，必须 brew 装。之前编译+链接全过，
      # 就是死在 Stripping 之后的打包/签名步骤。
      # ---------------------------------------------------------------------
      - name: Install packaging tools
        run: |
          set +e
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install dpkg 2>&1 | tail -n 5 || true
          brew install ldid 2>&1 | tail -n 5 || true
          echo "--- dpkg-deb ---"
          command -v dpkg-deb || ls -la "$(brew --prefix 2>/dev/null)/bin/dpkg-deb" 2>/dev/null || echo "dpkg-deb 仍不可用"
          echo "--- ldid ---"
          command -v ldid || ls -la "$(brew --prefix 2>/dev/null)/bin/ldid" 2>/dev/null || echo "ldid 仍不可用"
          exit 0

      # ---------------------------------------------------------------------
      # 编译。关键点：
      #   - 把完整输出 tee 到 build_output.txt，失败时切成 ::error:: 注解，
      #     这样不用登录 GitHub 也能从 API 读到真正的报错行。
      #   - 不要用 make clean（Theos 的 clean 在没有构建目录时可能返回非零）。
      #   - 失败时：最后 40 行 + 全日志里所有 error 相关行都做成注解。
      # ---------------------------------------------------------------------
      - name: Build package
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          MAKE="${MAKE_BIN:-make}"
          echo "工作目录: $PWD"
          echo "使用: $MAKE"
          "$MAKE" --version 2>&1 | head -n 1
          rm -rf packages
          echo "=== 开始编译 ==="
          "$MAKE" package FINALPACKAGE=1 DEBUG=0 2>&1 | tee "$GITHUB_WORKSPACE/build_output.txt"
          STATUS=${PIPESTATUS[0]}
          echo "=== make 退出码: $STATUS ==="
          if [ "$STATUS" -ne 0 ]; then
            tail -n 50 "$GITHUB_WORKSPACE/build_output.txt" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\\r'/'%0D'}"
              line="${line//$'\\n'/'%0A'}"
              echo "::error::$line"
            done
            exit 1
          fi
      # 校验是否真的产出了 deb 和正确架构的 dylib
      - name: Verify build output
        if: success()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "=== 检查 arm64e dylib ==="
          DYLIB="$(find .theos -type f -name 'WeChatGlassGroups.dylib' 2>/dev/null | head -n 1)"
          test -n "$DYLIB" || { echo "::error::没有找到编译后的 WeChatGlassGroups.dylib"; exit 1; }
          lipo -archs "$DYLIB"
          lipo -archs "$DYLIB" | grep -q 'arm64e' || { echo "::error::dylib 不含 arm64e"; exit 1; }
          echo "=== 检查本次生成的 DEB ==="
          set -- packages/*.deb
          test -f "$1" || { echo "::error::packages/ 中没有新 DEB"; exit 1; }
          test "$#" -eq 1 || { echo "::error::本次构建生成了多个 DEB，拒绝误发"; exit 1; }
          DEB="$1"
          VERSION="$(dpkg-deb -f "$DEB" Version)"
          ARCH="$(dpkg-deb -f "$DEB" Architecture)"
          echo "DEB=$DEB VERSION=$VERSION ARCH=$ARCH"
          test "$VERSION" = "0.4.5" || { echo "::error::版本不匹配：$VERSION"; exit 1; }
          CONTROL="$(dpkg-deb -f "$DEB")"
          INSTALLED_SIZE_COUNT="$(echo "$CONTROL" | awk '/^Installed-Size:/{n++} END{print n+0}')"
          test "$INSTALLED_SIZE_COUNT" -eq 1 || { echo "::error::Installed-Size 字段数量异常：$INSTALLED_SIZE_COUNT"; exit 1; }
          dpkg-deb -c "$DEB" | grep -F 'var/jb/Library/MobileSubstrate/DynamicLibraries/WeChatGlassGroups.dylib' >/dev/null || {
            echo "::error::DEB 内缺少 Rootless 动态库安装路径"
            exit 1
          }
          echo "DEB 校验通过：$DEB"

      # 全仓库搜索 .deb（Theos 不同版本/不同 scheme 放的位置不一样），
      # 找到就统一拷贝到 out/。找不到就报错并 dump 目录树，方便排查。
      - name: Collect deb
        if: success()
        run: |
          set -e
          mkdir -p out
          set -- packages/*.deb
          test -f "$1" || { echo "::error::没有可上传的新 DEB"; exit 1; }
          test "$#" -eq 1 || { echo "::error::检测到多个 DEB，停止上传"; exit 1; }
          cp "$1" out/
          ls -lh out/

      # 把 deb 提交回仓库 dist/ 目录 —— 用户直接从 GitHub 网页下载，
      # 不依赖 Artifacts（Artifacts 必须登录 GitHub 才能下载）。
      # 提交信息带 [skip ci]，不会触发下一轮编译。
      #
      # ⚠️ 两个必须注意的点（都真实踩过）：
      #   1) git add -f：.gitignore 里有 *.deb，不加 -f 会静默跳过，
      #      结果"提交成功"但 dist 里什么都没有。
      #   2) git push origin HEAD:main：actions/checkout 检出的是
      #      detached HEAD，直接 git push 会报 "not currently on a branch"。
      - name: Commit deb to repo
        if: success()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          DEB_FILE="$(find out -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          test -n "$DEB_FILE" || { echo "::error::out/ 中没有 DEB"; exit 1; }
          DEB_NAME="$(basename "$DEB_FILE")"
          mkdir -p dist
          cp "$DEB_FILE" "dist/$DEB_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "dist/$DEB_NAME"
          if git diff --cached --quiet; then
            echo "::error::新 DEB 与仓库现有文件完全相同，拒绝伪报更新"
            exit 1
          fi
          git commit -m "build: publish $DEB_NAME [skip ci]"
          git push origin HEAD:main
          echo "已发布：dist/$DEB_NAME"

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGlassGroups-deb
          path: out/*.deb
          if-no-files-found: warn
          retention-days: 30

      # 完整编译日志：失败时这就是唯一的线索来源
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build_output.txt
          if-no-files-found: ignore
