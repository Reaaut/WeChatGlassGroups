name: Build Tweak

# 在 macOS runner 上编译 Theos 插件。
# 产物：Actions 页面 → 这次 run → 底部 Artifacts → 下载 WeChatGlassGroups-deb
#
# ⚠️ 已踩过的坑，改这个文件时别再犯（每条都真实翻车过）：
#
#   1) 不要用 working-directory 指向工程目录。GitHub 把仓库放在
#      /Users/runner/work/<仓库名>/<仓库名>，仓库内又有一层 WeChatGlassGroups/，
#      叠加后会变成三层同名路径 → 目录不存在 → shell 启动失败。统一用 cd。
#
#   2) GitHub Actions 的 bash 默认带 -e，任何命令非零退出就整步失败。
#      所以"纯诊断步骤"很危险（一句 command -v 就能让整轮变红）。
#
#   3) 不要覆盖 env.PATH。
#
#   4) 不要改成 macos-13：那是 x86_64 runner，编不出 arm64e，装 iPhone 14 Pro 无效。
#
#   5) 失败信息要能被读到：用 ::error:: 写注解、用 tee 落盘日志。
#      否则只能看到 "exit code 1"，什么线索都没有（已经吃过这个亏）。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    # 允许把编译出来的 deb 提交回仓库（用户直接从网页下载）
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 找到 Theos（runner 镜像通常自带），找不到就克隆一份
      - name: Find Theos
        run: |
          set +e
          FOUND=""
          if [ -n "$THEOS" ] && [ -f "$THEOS/makefiles/common.mk" ]; then FOUND="$THEOS"; fi
          for d in "$HOME/theos" "$GITHUB_WORKSPACE/theos" /opt/theos /Users/runner/theos; do
            if [ -z "$FOUND" ] && [ -f "$d/makefiles/common.mk" ]; then FOUND="$d"; fi
          done
          if [ -z "$FOUND" ]; then
            echo "未找到 Theos，克隆一份"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos" || true
            FOUND="$HOME/theos"
          fi
          echo "THEOS=$FOUND" >> "$GITHUB_ENV"
          echo "使用 Theos: $FOUND"
          # sdks 是 submodule，里面才是 iPhoneOS SDK
          if [ -d "$FOUND/.git" ] && [ ! -d "$FOUND/sdks/iPhoneOS16.4.sdk" ]; then
            echo "同步 sdks submodule..."
            git -C "$FOUND" submodule update --init --recursive || true
          fi
          echo "--- sdks ---"
          ls -la "$FOUND/sdks" 2>/dev/null || echo "sdks 不存在"
          exit 0

      # 定位 make，并把结果写进 GITHUB_ENV / GITHUB_PATH
      - name: Locate make
        run: |
          set +e
          echo "当前 PATH=$PATH"
          MAKE_BIN="$(command -v make 2>/dev/null)"
          if [ -z "$MAKE_BIN" ] && [ -x /usr/bin/make ]; then MAKE_BIN=/usr/bin/make; fi
          if [ -z "$MAKE_BIN" ]; then
            for c in /Library/Developer/CommandLineTools/usr/bin/make \
                     /Applications/Xcode.app/Contents/Developer/usr/bin/make; do
              if [ -x "$c" ]; then MAKE_BIN="$c"; break; fi
            done
          fi
          if [ -n "$MAKE_BIN" ]; then
            echo "找到 make: $MAKE_BIN"
            echo "MAKE_BIN=$MAKE_BIN" >> "$GITHUB_ENV"
            dirname "$MAKE_BIN" >> "$GITHUB_PATH"
          else
            echo "⚠️ 找不到 make"
          fi
          exit 0

      # ---------------------------------------------------------------------
      # Theos 打包依赖：dpkg-deb（打 deb 包）+ ldid（给 dylib 签名）。
      # macOS runner 默认都没有，必须 brew 装。之前编译+链接全过，
      # 就是死在 Stripping 之后的打包/签名步骤。
      # ---------------------------------------------------------------------
      - name: Install packaging tools
        run: |
          set +e
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew install dpkg 2>&1 | tail -n 5 || true
          brew install ldid 2>&1 | tail -n 5 || true
          echo "--- dpkg-deb ---"
          command -v dpkg-deb || ls -la "$(brew --prefix 2>/dev/null)/bin/dpkg-deb" 2>/dev/null || echo "dpkg-deb 仍不可用"
          echo "--- ldid ---"
          command -v ldid || ls -la "$(brew --prefix 2>/dev/null)/bin/ldid" 2>/dev/null || echo "ldid 仍不可用"
          exit 0

      # ---------------------------------------------------------------------
      # 编译。关键点：
      #   - 把完整输出 tee 到 build_output.txt，失败时切成 ::error:: 注解，
      #     这样不用登录 GitHub 也能从 API 读到真正的报错行。
      #   - 不要用 make clean（Theos 的 clean 在没有构建目录时可能返回非零）。
      #   - 失败时：最后 40 行 + 全日志里所有 error 相关行都做成注解。
      # ---------------------------------------------------------------------
      - name: Build package
        run: |
          set +e
          MAKE="${MAKE_BIN:-make}"
          echo "使用: $MAKE"
          "$MAKE" --version 2>&1 | head -n 1

          cd WeChatGlassGroups
          echo "=== 开始编译 ==="
          "$MAKE" package FINALPACKAGE=1 DEBUG=0 2>&1 | tee ../build_output.txt
          STATUS=${PIPESTATUS[0]}
          echo "=== make 退出码: $STATUS ==="

          if [ "$STATUS" -ne 0 ]; then
            emit() {
              local line="$1"
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            }
            emit "make 失败，退出码 $STATUS。===== 最后 40 行 ====="
            tail -n 40 ../build_output.txt | while IFS= read -r line; do emit "$line"; done
            emit "===== 全日志中的 error 相关行 ====="
            grep -n -i -E 'error|no such file|command not found|not found|failed|invalid|denied' ../build_output.txt \
              | tail -n 30 | while IFS= read -r line; do emit "$line"; done
            exit 1
          fi
          exit 0

      # 校验是否真的产出了 deb 和正确架构的 dylib
      - name: Verify build output
        if: always()
        run: |
          set +e
          echo "=== 找 dylib ==="
          find WeChatGlassGroups/.theos -name '*.dylib' 2>/dev/null || echo "没有 dylib"
          echo "=== 找 deb ==="
          ls -la WeChatGlassGroups/packages 2>/dev/null || echo "没有 packages 目录"
          DYLIB="$(find WeChatGlassGroups/.theos -name 'WeChatGlassGroups.dylib' 2>/dev/null | head -n1)"
          if [ -n "$DYLIB" ]; then
            echo "--- 架构（期望 arm64e）---"
            lipo -archs "$DYLIB"
            echo "--- 链接的库 ---"
            otool -L "$DYLIB"
          fi
          exit 0

      # 全仓库搜索 .deb（Theos 不同版本/不同 scheme 放的位置不一样），
      # 找到就统一拷贝到 out/。找不到就报错并 dump 目录树，方便排查。
      - name: Collect deb
        if: success()
        run: |
          set +e
          mkdir -p out
          find . -name '*.deb' -type f 2>/dev/null | while IFS= read -r f; do
            echo "找到 deb: $f"
            cp "$f" out/
          done
          echo "--- out 目录 ---"
          ls -la out
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            {
              echo "out 是空的！全仓库没有 .deb"
              echo "--- 工程目录树（前 60 行）---"
              ls -laR WeChatGlassGroups 2>/dev/null | head -n 60
            } | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done
            exit 1
          fi
          exit 0

      # 把 deb 提交回仓库 dist/ 目录 —— 用户直接从 GitHub 网页下载，
      # 不依赖 Artifacts（这个账号的 Artifacts 一直有问题）。
      # 提交信息带 [skip ci]，不会触发下一轮编译。
      - name: Commit deb to repo
        if: success()
        run: |
          set +e
          mkdir -p dist
          cp out/*.deb dist/ 2>/dev/null
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist 没有变化，跳过提交"
          else
            git commit -m "build: 更新 deb [skip ci]"
            git push 2>&1 || echo "⚠️ 推送失败：去仓库 Settings → Actions → General → Workflow permissions 选 Read and write，然后重新跑一次"
          fi
          echo "--- dist 目录 ---"
          ls -la dist
          exit 0

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WeChatGlassGroups-deb
          path: out/*.deb
          if-no-files-found: warn
          retention-days: 30

      # 完整编译日志：失败时这就是唯一的线索来源
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build_output.txt
          if-no-files-found: ignore
