name: Build WCGlass Offline (Rootless)

on:
  push:
    branches: [wcglass-offline-rootless]
    paths:
      - "WCGlassOffline/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WCGlassOffline
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@v1
      - name: Build rootless package
        run: |
          make clean
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: WCGlassOffline-rootless-deb
          path: WCGlassOffline/packages/*.deb
          if-no-files-found: error
          retention-days: 14
